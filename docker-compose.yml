services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-research-backend

    ports:
      - "8001:8001"

    volumes:
      - research_db:/app/data

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ai-research-frontend

    ports:
      - "5174:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  research_db: